<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURAL CORE – Copper Dreams · Amiga 500 Style Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #scr{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 80px rgba(90,140,255,.18)}
  #c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(1.15) contrast(1.06)}
  #scr::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--lh,3px)*.5),rgba(0,0,0,.28) calc(var(--lh,3px)*.5),rgba(0,0,0,.28) var(--lh,3px))}
  #scr::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%)}
  #hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;font:8px "Press Start 2P",monospace;color:#555;letter-spacing:1px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="scr"><canvas id="c"></canvas></div></div>
<div id="hint">F: VOLLBILD &nbsp;·&nbsp; M: TON AN/AUS</div>
<script>
'use strict';
/* ================================================================
   NEURAL CORE  –  "COPPER DREAMS"
   320x256 PAL low-res · 12-bit colour · 4-channel realtime synth
   ================================================================ */
const W = 320, H = 256;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
const scr = document.getElementById('scr');
const FONT = '"Press Start 2P", "Courier New", monospace';
const TAU = Math.PI * 2;

// 12-bit Amiga colour quantisation (4 bits per channel)
const q4 = v => { v = v < 0 ? 0 : v > 255 ? 255 : v; return ((v | 0) >> 4) * 17; };
const pack = (r, gg, b) => ((255 << 24) | (q4(b) << 16) | (q4(gg) << 8) | q4(r)) >>> 0;
const rgb = (r, gg, b) => `rgb(${q4(r)},${q4(gg)},${q4(b)})`;
const img = g.createImageData(W, H);
const p32 = new Uint32Array(img.data.buffer);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function threshold(x, w, h) { const d = x.getImageData(0, 0, w, h); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0; x.putImageData(d, 0, 0); }

function fit() {
  const iw = innerWidth, ih = innerHeight - 22;
  const w = Math.min(iw, ih * 4 / 3), h = w * 3 / 4;
  scr.style.width = w + 'px'; scr.style.height = h + 'px';
  scr.style.setProperty('--lh', (h / 256) + 'px');
}
addEventListener('resize', fit); fit();

/* ---------------- texts ---------------- */
const SCROLL = '                         HALLO DEMOSZENE!   NEURAL CORE PRAESENTIERT:  COPPER DREAMS  ...  ' +
  'EINE LIEBESERKLAERUNG AN DEN AMIGA 500 ...   ALLES HIER LAEUFT IN ECHTZEIT: COPPERBARS, GLENZVEKTOREN, ' +
  'SINUSSCROLLER, BOINGBALL, PLASMA, TWISTER, TEXTURTUNNEL UND DOTMORPHING ...   DIE MUSIK IST EIN 4-KANAL-TRACKERSONG, ' +
  'KOMPLETT LIVE IM BROWSER SYNTHETISIERT - NULL SAMPLES, NULL BYTES MODFILE, NUR OSZILLATOREN UND RAUSCHEN ...   ' +
  'PALETTE: ECHTE 12 BIT, 4096 FARBEN, WIE DAMALS ...   CODE, GRAFIK UND MUSIK: CLAUDE   ...   ' +
  'GREETINGS AN ALLE CODER, PIXLER UND TRACKER-MUSIKER DA DRAUSSEN - IHR HABT DIE 80ER UND 90ER BUNTER GEMACHT!   ...   ' +
  'UND JETZT BITTE ABSTIMMEN - UND ZWAR FUER UNS!  ;)   ...   TEXT RESTARTS ...                    ';
const BOING_WORDS = ['OLDSCHOOL', 'NEVER', 'DIES!', 'BOING!'];
const PLASMA_MSG = ['KEINE SAMPLES.', 'KEINE LIBRARIES.', 'NUR MATHE.', 'UND LIEBE.'];
const CRED = ['', '', 'CODE ........ CLAUDE', 'GRAFIK ...... CLAUDE', 'MUSIK ....... CLAUDE', '',
  '4 KANAELE', '0 SAMPLES', '100% ECHTZEIT', '', 'DANKE FUERS ZUSCHAUEN!'];

/* ---------------- glyphs & logo ---------------- */
const GW = 16, GH = 18, GLY = {};
function buildGlyphs(str) {
  for (const ch of new Set(str)) {
    if (GLY[ch] || ch === ' ') continue;
    const [m, mx] = mk(GW, GH);
    mx.font = `16px ${FONT}`; mx.textBaseline = 'top'; mx.fillStyle = '#fff'; mx.fillText(ch, 0, 0);
    threshold(mx, GW, GH);
    mx.globalCompositeOperation = 'source-in';
    const gr = mx.createLinearGradient(0, 0, 0, 16);
    gr.addColorStop(0, '#ffffee'); gr.addColorStop(.3, '#ffdd44'); gr.addColorStop(.62, '#ff6611'); gr.addColorStop(1, '#bb1177');
    mx.fillStyle = gr; mx.fillRect(0, 0, GW, GH);
    const [c, x] = mk(GW, GH);
    x.drawImage(m, 2, 2); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#110022'; x.fillRect(0, 0, GW, GH);
    x.globalCompositeOperation = 'source-over'; x.drawImage(m, 0, 0);
    GLY[ch] = c;
  }
}
let LOGO, LW, LH;
function buildLogo() {
  const txt = 'NEURAL CORE', sz = 24; LW = txt.length * sz + 10; LH = sz + 10;
  const [m, mx] = mk(LW, LH);
  mx.font = `${sz}px ${FONT}`; mx.textBaseline = 'top'; mx.fillStyle = '#fff'; mx.fillText(txt, 3, 3); threshold(mx, LW, LH);
  const tint = col => { const [t, tx] = mk(LW, LH); tx.drawImage(m, 0, 0); tx.globalCompositeOperation = 'source-in'; tx.fillStyle = col; tx.fillRect(0, 0, LW, LH); return t; };
  const [c, x] = mk(LW, LH);
  const ext = tint('#331177'), dark = tint('#000');
  for (let i = 5; i >= 1; i--) x.drawImage(ext, i, i);
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) x.drawImage(dark, dx, dy);
  const [cc, cx] = mk(LW, LH); cx.drawImage(m, 0, 0); cx.globalCompositeOperation = 'source-in';
  const gr = cx.createLinearGradient(0, 3, 0, 3 + sz);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(.44, '#66ccff'); gr.addColorStop(.5, '#112244');
  gr.addColorStop(.56, '#ffcc66'); gr.addColorStop(1, '#aa3300');
  cx.fillStyle = gr; cx.fillRect(0, 0, LW, LH);
  x.drawImage(cc, 0, 0); LOGO = c;
}
function drawLogo(t, y0, amp) {
  const x0 = (W - LW) / 2;
  for (let y = 0; y < LH; y++) {
    const dx = Math.sin(y * 0.18 + t * 5) * amp + Math.sin(t * 1.3) * 6;
    g.drawImage(LOGO, 0, y, LW, 1, (x0 + dx) | 0, y0 + y, LW, 1);
  }
}
function txt(s, x, y, col, size = 8, full) {
  g.font = `${size}px ${FONT}`; g.textBaseline = 'top'; g.fillStyle = col;
  if (x === 'c') x = ((W - (full || s).length * size) / 2) | 0;
  g.fillText(s, x, y);
}
function big(s, x, y, sc = 1) {
  const w = s.length * 16 * sc;
  if (x === 'c') x = (W - w) / 2;
  for (let i = 0; i < s.length; i++) { const gl = GLY[s[i]]; if (gl) g.drawImage(gl, (x + i * 16 * sc) | 0, y | 0, GW * sc, GH * sc); }
}

/* ---------------- shared effects ---------------- */
let dt = 0;
const STARS = []; for (let i = 0; i < 240; i++) STARS.push([Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random()]);
function stars(speed, cx = 160, cy = 128) {
  for (const s of STARS) {
    s[2] -= dt * speed;
    if (s[2] <= 0.02) { s[0] = Math.random() * 2 - 1; s[1] = Math.random() * 2 - 1; s[2] = 1; }
    const z = s[2], x = cx + s[0] / z * 120, y = cy + s[1] / z * 100;
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    const b = (1 - z) * 290; g.fillStyle = rgb(b, b, b + 30);
    const sz = z < 0.25 ? 2 : 1; g.fillRect(x | 0, y | 0, sz, sz);
  }
}
function copper(t, y0, y1, n, boost) {
  const mid = (y0 + y1) / 2, amp = (y1 - y0) / 2 - 8;
  for (let i = n - 1; i >= 0; i--) {
    const cy = mid + Math.sin(t * 1.9 + i * 0.5) * amp, hue = (i * 360 / n + t * 40) % 360;
    for (let k = -7; k <= 7; k++) {
      const b = 1 - Math.abs(k) / 8;
      g.fillStyle = `hsl(${hue | 0},90%,${Math.min(85, 6 + b * b * 62 * boost) | 0}%)`;
      g.fillRect(0, (cy + k) | 0, W, 1);
    }
  }
}
function scroller(t, baseY, amp) {
  const totW = SCROLL.length * 16, pos = (t * 95) % (totW + W);
  const first = Math.max(0, Math.floor((pos - W - 16) / 16));
  for (let i = first; i < SCROLL.length; i++) {
    const x = W + i * 16 - pos; if (x > W) break;
    const gl = GLY[SCROLL[i]]; if (!gl) continue;
    for (let s = 0; s < 8; s++) {
      const cx = x + s * 2;
      const y = baseY + Math.sin(cx * 0.04 + t * 3) * amp + Math.sin(cx * 0.013 - t * 1.3) * amp * 0.4;
      g.drawImage(gl, s * 2, 0, 2, GH, cx | 0, y | 0, 2, GH);
    }
  }
}
const [TMP, tg] = mk(W, H);
function reflect(t, MY) {
  tg.drawImage(cv, 0, 0);
  const RH = H - MY;
  g.fillStyle = '#000'; g.fillRect(0, MY, W, RH);
  for (let j = 0; j < RH; j++) {
    const sy = MY - 1 - j * 1.15; if (sy < 0) break;
    const dx = Math.sin(j * 0.35 + t * 5) * (0.5 + j * 0.07);
    g.drawImage(TMP, 0, sy | 0, W, 1, dx, MY + j, W, 1);
  }
  g.fillStyle = 'rgba(0,30,100,0.5)'; g.fillRect(0, MY, W, RH);
  g.fillStyle = '#88ccff'; g.fillRect(0, MY, W, 1);
}
function bgGrad(top, bot) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ---------------- glenz vector ---------------- */
const GV = []; for (let i = 0; i < 8; i++) GV.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1]);
const FACES = [[1, 3, 7, 5, [1, 0, 0]], [0, 4, 6, 2, [-1, 0, 0]], [2, 6, 7, 3, [0, 1, 0]], [0, 1, 5, 4, [0, -1, 0]], [4, 5, 7, 6, [0, 0, 1]], [0, 2, 3, 1, [0, 0, -1]]];
const GT = [];
for (const f of FACES) { const ai = GV.length; GV.push(f[4].map(v => v * 1.9)); for (let k = 0; k < 4; k++) GT.push([f[k], f[(k + 1) % 4], ai]); }
function glenz(t, cx, cy, sc) {
  const sa = Math.sin(t * 0.9), ca = Math.cos(t * 0.9), sb = Math.sin(t * 1.3), cb = Math.cos(t * 1.3), s3 = Math.sin(t * 0.4), c3 = Math.cos(t * 0.4);
  const P = GV.map(([x, y, z]) => {
    const y1 = y * ca - z * sa, z1 = y * sa + z * ca;
    const x2 = x * cb + z1 * sb, z2 = -x * sb + z1 * cb;
    const x3 = x2 * c3 - y1 * s3, y3 = x2 * s3 + y1 * c3;
    return [x3 * sc, y3 * sc, z2 * sc];
  });
  const D = 5.5, F = 110, tris = [];
  GT.forEach((tr, i) => {
    const a = P[tr[0]], b = P[tr[1]], c = P[tr[2]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const mx = (a[0] + b[0] + c[0]) / 3, my = (a[1] + b[1] + c[1]) / 3, mz = (a[2] + b[2] + c[2]) / 3;
    if (nx * mx + ny * my + nz * mz < 0) { nx = -nx; ny = -ny; nz = -nz; }
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    const front = nx * mx + ny * my + nz * (mz + D) < 0;
    const l = Math.max(0, -0.4 * nx - 0.5 * ny - 0.77 * nz);
    tris.push({ z: mz, front, l, a, b, c, col: i & 1 });
  });
  tris.sort((p, q) => q.z - p.z);
  for (const tr of tris) {
    const base = tr.col ? [235, 240, 255] : [40, 100, 255];
    const k = tr.front ? 0.35 + 0.75 * tr.l : 0.35;
    g.globalAlpha = tr.front ? 0.62 : 0.55;
    g.fillStyle = rgb(base[0] * k, base[1] * k, base[2] * k);
    g.beginPath();
    for (const p of [tr.a, tr.b, tr.c]) { const s = F / (p[2] + D); g.lineTo(cx + p[0] * s, cy + p[1] * s); }
    g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
}

/* ---------------- boing ball ---------------- */
const BR = 34, BS = BR * 2 + 2;
const [BC, bxc] = mk(BS, BS);
const bimg = bxc.createImageData(BS, BS), b32 = new Uint32Array(bimg.data.buffer);
function renderBall(spin, tilt) {
  const ct = Math.cos(tilt), st = Math.sin(tilt), seg = Math.PI / 8;
  for (let py = 0; py < BS; py++) for (let px = 0; px < BS; px++) {
    const dx = (px - BR - 0.5) / BR, dy = (py - BR - 0.5) / BR, d2 = dx * dx + dy * dy, o = py * BS + px;
    if (d2 > 1) { b32[o] = 0; continue; }
    const nz = Math.sqrt(1 - d2), x = dx * ct - dy * st, y = dx * st + dy * ct;
    const lon = Math.atan2(x, nz) + spin, lat = Math.asin(Math.max(-1, Math.min(1, y)));
    const red = ((Math.floor(lon / seg) + Math.floor((lat + Math.PI / 2) / seg)) & 1) === 0;
    const l = 0.28 + 0.8 * Math.max(0, -0.45 * dx - 0.5 * dy + 0.74 * nz);
    b32[o] = red ? pack(240 * l, 25 * l, 35 * l) : pack(250 * l, 250 * l, 250 * l);
  }
  bxc.putImageData(bimg, 0, 0);
}
let spinAcc = 0;
function boingScene(t, songT) {
  const HZ = 176;
  g.fillStyle = rgb(176, 176, 188); g.fillRect(0, 0, W, H);
  g.fillStyle = rgb(170, 40, 180);
  for (let x = 8; x < W; x += 24) g.fillRect(x, 0, 1, HZ);
  for (let y = 8; y < HZ; y += 24) g.fillRect(0, y, W, 1);
  g.fillStyle = rgb(150, 150, 168); g.fillRect(0, HZ, W, H - HZ);
  g.strokeStyle = rgb(170, 40, 180); g.lineWidth = 1; g.beginPath();
  for (let x = 8 - 24 * 8; x < W + 24 * 8; x += 24) { g.moveTo(x + 0.5, HZ); g.lineTo(160 + (x - 160) * 1.9 + 0.5, H); }
  for (let k = 0; k < 7; k++) { const y = (HZ + Math.pow(k / 6, 1.7) * (H - HZ)) | 0; g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); }
  g.stroke();
  // raster band + words
  copper(t, 2, 50, 4, 0.9);
  const w = BOING_WORDS[Math.floor(songT / 1.92) % 4], sc = 1.5 + snP * 0.5;
  big(w, 'c', 26 - GH * sc / 2, sc);
  // ball
  const ph = (songT / 0.96) % 1, hb = Math.sin(Math.PI * ph);
  const by = HZ + 18 - BR - hb * 108;
  const tri = (t * 0.16) % 2, fx = tri < 1 ? tri : 2 - tri, dir = tri < 1 ? 1 : -1;
  const bxp = BR + 6 + fx * (W - 2 * BR - 12);
  spinAcc += dt * dir * 2.6; renderBall(spinAcc, 0.38);
  g.fillStyle = 'rgba(40,0,60,0.35)'; g.beginPath(); g.arc(bxp + 16, by + 6, BR, 0, TAU); g.fill();
  g.drawImage(BC, (bxp - BR - 1) | 0, (by - BR - 1) | 0);
  scroller(songT, 218, 8);
}

/* ---------------- plasma + twister ---------------- */
const SI = new Int32Array(256); for (let i = 0; i < 256; i++) SI[i] = (Math.sin(i / 256 * TAU) * 63 + 64) | 0;
const PAL = new Uint32Array(256);
for (let i = 0; i < 256; i++) { const x = i / 256 * TAU; PAL[i] = pack(110 + 100 * Math.cos(x), 90 + 90 * Math.cos(x + 2.1), 140 + 110 * Math.cos(x + 4.2)); }
const RAD = new Uint16Array(W * H);
for (let y = 0, o = 0; y < H; y++) for (let x = 0; x < W; x++, o++) RAD[o] = (Math.hypot(x - 160, y - 128) * 2.2) | 0;
function plasma(t) {
  const a = (t * 47) | 0, b = (t * -31) | 0, c = (t * 23) | 0, d = (t * -60) | 0, sh = (t * 40) | 0;
  let o = 0;
  for (let y = 0; y < H; y++) {
    const sy = SI[(y * 3 + b) & 255];
    for (let x = 0; x < W; x++, o++) {
      const v = SI[(x * 2 + a) & 255] + sy + SI[((x + y) + c) & 255] + SI[(RAD[o] + d) & 255];
      p32[o] = PAL[((v >> 1) + sh) & 255];
    }
  }
  g.putImageData(img, 0, 0);
}
const TWC = [[255, 80, 80], [255, 220, 60], [60, 220, 255], [170, 90, 255]];
const TWL = TWC.map(c => Array.from({ length: 33 }, (_, i) => { const k = 0.15 + 0.85 * i / 32; return rgb(c[0] * k, c[1] * k, c[2] * k); }));
function twister(t) {
  const w = 34, hp = Math.PI / 2;
  for (let y = 0; y < H; y++) {
    const cx = 160 + Math.sin(t * 0.9 + y * 0.011) * 70;
    const a = t * 2.2 + Math.sin(t * 0.6 + y * 0.009) * 2.6;
    const x0 = cx + Math.sin(a) * w, x1 = cx + Math.sin(a + hp) * w, x2 = cx + Math.sin(a + 2 * hp) * w, x3 = cx + Math.sin(a + 3 * hp) * w;
    const xs = [x0, x1, x2, x3, x0];
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect((Math.min(x0, x1, x2, x3) + 6) | 0, y, (Math.max(x0, x1, x2, x3) - Math.min(x0, x1, x2, x3)) | 0, 1);
    for (let i = 0; i < 4; i++) {
      const p = xs[i], q = xs[i + 1];
      if (q > p) { const s = Math.min(32, ((q - p) / (w * 1.4143) * 32) | 0); g.fillStyle = TWL[i][s]; g.fillRect(p | 0, y, ((q - p) + 1) | 0, 1); }
    }
  }
}
function plasmaScene(t, songT) {
  plasma(t); twister(t);
  g.fillStyle = 'rgba(0,0,20,0.6)'; g.fillRect(0, 14, W, 30);
  const bi = Math.floor(t / 1.92), msg = PLASMA_MSG[bi % 4], lt = t - bi * 1.92;
  const n = Math.min(msg.length, Math.floor(lt * 18));
  const x0 = (W - msg.length * 16) / 2;
  big(msg.slice(0, n), x0, 20, 1);
  scroller(songT, 212, 12);
}

/* ---------------- tunnel + bobs ---------------- */
const TW = W * 2, TH = H * 2;
const TD = new Uint16Array(TW * TH), TA = new Uint8Array(TW * TH), TS = new Uint8Array(TW * TH);
for (let y = 0, i = 0; y < TH; y++) for (let x = 0; x < TW; x++, i++) {
  const dx = x - W, dy = y - H, r = Math.sqrt(dx * dx + dy * dy) + 0.0001;
  TD[i] = (5200 / r) & 0xffff;
  TA[i] = ((Math.atan2(dy, dx) / TAU + 0.5) * 256) & 255;
  TS[i] = Math.min(7, (r / 20) | 0);
}
const TEXS = new Uint32Array(8 * 65536);
for (let v = 0; v < 256; v++) for (let u = 0; u < 256; u++) {
  const n = (u ^ v) & 63, ch = ((u >> 5) ^ (v >> 4)) & 1;
  let r, gg, b;
  if (ch) { r = 40 + n * 1.5; gg = 10 + n * 0.6; b = 100 + n * 2; } else { r = 10 + n * 0.4; gg = 40 + n * 2; b = 80 + n * 2; }
  if ((u & 31) < 2 || (v & 15) < 1) { r = 210; gg = 255; b = 255; }
  for (let s = 0; s < 8; s++) { const k = (s + 1) / 8; TEXS[(s << 16) | (v << 8) | u] = pack(r * k, gg * k, b * k); }
}
function tunnel(t) {
  const sx = (W / 2 + Math.sin(t * 0.8) * W * 0.33) | 0, sy = (H / 2 + Math.sin(t * 1.1) * H * 0.33) | 0;
  const du = (t * 110) | 0, dv = (t * 28 + Math.sin(t * 0.5) * 40) | 0;
  let o = 0;
  for (let y = 0; y < H; y++) {
    let ti = (y + sy) * TW + sx;
    for (let x = 0; x < W; x++, ti++) p32[o++] = TEXS[(TS[ti] << 16) | (((TA[ti] + dv) & 255) << 8) | ((TD[ti] + du) & 255)];
  }
  g.putImageData(img, 0, 0);
}
const BOBS = [[255, 90, 200], [90, 220, 255], [255, 230, 90]].map(c => {
  const [bc, x] = mk(16, 16);
  const gr = x.createRadialGradient(6, 5, 0.5, 8, 8, 8);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.35, rgb(...c)); gr.addColorStop(1, rgb(c[0] * .2, c[1] * .2, c[2] * .2));
  x.fillStyle = gr; x.beginPath(); x.arc(8, 8, 7.5, 0, TAU); x.fill(); threshold(x, 16, 16);
  return bc;

  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if ((e.key === 'm' || e.key === 'M') && AC) { muted = !muted; master.gain.setTargetAtTime(muted ? 0 : 0.7, AC.currentTime, 0.05); }
});

(async () => {
  try { await Promise.race([document.fonts.load(`16px ${FONT}`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildGlyphs(SCROLL + BOING_WORDS.join('') + PLASMA_MSG.join('') + 'COPPER DREAMS');
  buildLogo();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
