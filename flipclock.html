<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">

<title>Uhr</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uhr">
<meta name="theme-color" content="#0a0908">
<style>
  :root {
    --u: min(0.8vw, 1.7vh);            /* Grundmaß für Gehäuse, Schrift und Knöpfe */
    --w: min(10vw, 33vh);              /* Breite einer Klapptafel */
    --tw: min(9.6vw, 21vh);            /* Breite einer Nixie-Röhre */
    --bg: #0a0908;
    --card: #1b1b1b;
    --card-dark: #121212;
    --card-bottom: #181818;
    --slit: #000;
    --ink: #f1e6cf;
    --accent: #e0662b;
    --edge: rgba(241, 230, 207, .38);
    /* Gehäuse: gebürstetes Aluminium (dunkle Variante) */
    --al-a: #6d7178;
    --al-b: #a4a8af;
    --al-c: #868a91;
    --al-d: #5f6369;
    --al-hi: #c9ccd2;       /* heller Glanzstreifen */
    --brush-op: .3;         /* Stärke der Bürstentextur */
    --brush: rgba(255, 255, 255, .07);
    --brush-dk: rgba(0, 0, 0, .09);
  }
  body.noseconds { --w: min(14vw, 37vh); --tw: min(13vw, 27vh); }

  :root.light {
    --bg: #ece6d8;
    --card: #fbf7ee;
    --card-dark: #e8e1d0;
    --card-bottom: #dcd4c0;
    --slit: #7d7768;
    --ink: #211e19;
    --accent: #c4501a;
    --edge: rgba(33, 30, 25, .5);
    /* Gehäuse: gebürstetes Aluminium (helle Variante) */
    --al-a: #b3b7bd;
    --al-b: #e6e8eb;
    --al-c: #c9ccd1;
    --al-d: #a8acb2;
    --al-hi: #f6f7f9;
    --brush-op: .26;
    --brush: rgba(255, 255, 255, .12);
    --brush-dk: rgba(0, 0, 0, .07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    transition: filter 2s ease, background .4s ease;
  }
  body.night { filter: brightness(0.3); }

  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* =========================== GEHÄUSE =========================== */
  .case {
    position: relative;
    display: flex; flex-direction: column;
    gap: calc(var(--u) * 1.5);
    padding: calc(var(--u) * 2.2) calc(var(--u) * 7.6);
    border-radius: calc(var(--u) * 2.4);
    isolation: isolate;
    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 30%, rgba(0,0,0,.16)),
      linear-gradient(98deg, var(--al-a), var(--al-b) 12%, var(--al-c) 26%, var(--al-hi) 35%, var(--al-c) 45%, var(--al-a) 58%, var(--al-b) 72%, var(--al-c) 86%, var(--al-d));
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .55),
      inset 1px 1px 0 rgba(255, 255, 255, .5),
      inset -1px -1px 0 rgba(0, 0, 0, .4),
      inset 0 -4px 8px rgba(0, 0, 0, .35),
      inset 0 0 0 1.5px rgba(0, 0, 0, .5),
      inset 0 0 0 calc(var(--u) * .45) rgba(255, 255, 255, .14),
      0 calc(var(--u) * 1.4) calc(var(--u) * 3.5) rgba(0, 0, 0, .75);
  }
  .case::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    border-radius: inherit;
    background-image: var(--streak), var(--grain-img);
    background-size: 480px 480px, 200px 200px;
    mix-blend-mode: overlay;
    opacity: var(--brush-op);
  }
  .screw {
    position: absolute;
    width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4);
    border-radius: 50%;
    background:
      linear-gradient(35deg, transparent 43%, rgba(0,0,0,.75) 43% 57%, transparent 57%),
      radial-gradient(circle at 35% 30%, #d9dce0, #8a8e95 55%, #45484e);
    box-shadow:
      0 0 0 calc(var(--u) * .22) rgba(0, 0, 0, .28),
      0 1px 1px calc(var(--u) * .22) rgba(255, 255, 255, .55);
  }
  .screw.tl { top: calc(var(--u) * 1.6); left: calc(var(--u) * 1.6); }
  .screw.tr { top: calc(var(--u) * 1.6); right: calc(var(--u) * 1.6); transform: rotate(60deg); }
  .screw.bl { bottom: calc(var(--u) * 1.6); left: calc(var(--u) * 1.6); transform: rotate(25deg); }
  .screw.br { bottom: calc(var(--u) * 1.6); right: calc(var(--u) * 1.6); transform: rotate(100deg); }

  /* Sichtfenster */
  .window {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 1.6);
    border-radius: calc(var(--u) * 1.2);
    background: #090807;
    box-shadow:
      inset 0 0 calc(var(--u) * 2) rgba(0, 0, 0, .95),
      inset 0 calc(var(--u) * .4) calc(var(--u) * .8) rgba(0, 0, 0, .9),
      inset 0 calc(var(--u) * .25) calc(var(--u) * .5) rgba(0, 0, 0, .6),
      0 1px 0 rgba(255, 255, 255, .22),
      0 -1px 0 rgba(0, 0, 0, .6);
  }
  .window::after {   /* Glasreflexion */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    border-radius: inherit;
    background:
      linear-gradient(115deg,
        transparent 33%,
        rgba(255,255,255,.03) 35%,
        rgba(255,255,255,.16) 37%,
        rgba(255,255,255,.26) 39%,
        rgba(255,255,255,.16) 41%,
        rgba(255,255,255,.03) 43%,
        transparent 45%),
      linear-gradient(115deg,
        transparent 55%,
        rgba(255,255,255,.03) 57%,
        rgba(255,255,255,.07) 58.5%,
        rgba(255,255,255,.03) 60%,
        transparent 62%),
      linear-gradient(180deg,
        rgba(255,255,255,.06) 0%,
        rgba(255,255,255,.02) 10%,
        transparent 20%);
  }
  :root.light .window::after {
    background:
      linear-gradient(115deg,
        transparent 33%,
        rgba(255,255,255,.18) 37%,
        rgba(255,255,255,.32) 39%,
        rgba(255,255,255,.18) 41%,
        transparent 45%),
      linear-gradient(180deg,
        rgba(255,255,255,.10) 0%,
        transparent 18%);
  }

  /* ---- Uhr-Zeile (alle Watchfaces) ---- */
  .clock {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  body:not(.face-flip)  .clock.flip   { display: none; }
  body:not(.face-nixie) .clock.nixie  { display: none; }
  body:not(.face-lcd)   .clock.lcd    { display: none; }
  body:not(.face-analog) .clock.analog { display: none; }
  body.noseconds .clock .seconds-group, body.noseconds .clock .colon.second { display: none !important; }

  .clock.flip  { gap: calc(var(--w) * 0.16); }
  .clock.nixie { gap: calc(var(--tw) * 0.14); }
  .clock.flip  .group { display: flex; gap: calc(var(--w) * 0.07); }
  .clock.nixie .group { display: flex; gap: calc(var(--tw) * 0.08); }

  /* ---- Druckknöpfe in der linken Gehäuseblende ---- */
  .ctrl {
    position: absolute;
    right: calc(100% + var(--u) * 1.3);
    top: calc(var(--u) * 1.6);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1.1);
    z-index: 40;
  }
  .cbtn {
    width: calc(var(--u) * 5); height: calc(var(--u) * 5);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 2.7); line-height: 1;
    font-family: inherit;
    color: #e8eaed;
    background: linear-gradient(180deg, #5a5e65, #383b40 55%, #2a2c30);
    border: 1px solid #0f1012;
    border-radius: calc(var(--u) * 1.2);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      inset 0 -2px 3px rgba(0, 0, 0, .35),
      0 calc(var(--u) * .35) 0 #101113,
      0 calc(var(--u) * .6) calc(var(--u) * .8) rgba(0, 0, 0, .55);
    cursor: pointer;
  }
  .cbtn:active {
    transform: translateY(calc(var(--u) * .3));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .25),
      inset 0 -1px 2px rgba(0, 0, 0, .4),
      0 calc(var(--u) * .08) 0 #101113;
  }
  .cbtn svg { width: calc(var(--u) * 2.9); height: calc(var(--u) * 2.9); display: block; }
  .cbtn { position: relative; }

  .ctrl.right { right: auto; left: calc(100% + var(--u) * 1.3); }
  .cbtn.on {
    transform: translateY(calc(var(--u) * .3));
    background: linear-gradient(180deg, #34373c, #2a2c30 55%, #222427);
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, .55),
      0 calc(var(--u) * .08) 0 #101113;
  }
  .cbtn.on::after {
    content: ""; position: absolute;
    top: calc(var(--u) * .5); right: calc(var(--u) * .5);
    width: calc(var(--u) * .7); height: calc(var(--u) * .7);
    border-radius: 50%;
    background: #ffa23c;
    box-shadow: 0 0 5px 2px rgba(255, 140, 30, .85);
  }

  /* =========================== KLAPPTAFELN =========================== */
  .clock.flip .colon { display: flex; flex-direction: column; gap: calc(var(--w) * 0.18); }
  .clock.flip .colon i {
    display: block; width: calc(var(--w) * 0.1); height: calc(var(--w) * 0.1);
    background: #e9dcc0; border-radius: 50%; opacity: .85;
  }

  .card {
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 1.4);
    perspective: calc(var(--w) * 6);
    font-size: calc(var(--w) * 1.12);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .half {
    position: absolute; left: 0; width: 100%; height: 50%;
    overflow: hidden;
    background: linear-gradient(var(--card), var(--card-dark));
    box-shadow: inset 0 0 0 max(1.5px, calc(var(--w) * 0.012)) var(--edge);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .half span {
    position: absolute; left: 0; width: 100%; height: 200%;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .top, .flip-top {
    top: 0; transform-origin: bottom;
    border-radius: calc(var(--w) * 0.08) calc(var(--w) * 0.08) 0 0;
    border-bottom: 1px solid var(--slit);
  }
  .top span, .flip-top span { top: 0; }
  .bottom, .flip-bottom {
    bottom: 0; transform-origin: top;
    background: linear-gradient(var(--card-dark), var(--card-bottom));
    border-radius: 0 0 calc(var(--w) * 0.08) calc(var(--w) * 0.08);
  }
  .bottom span, .flip-bottom span { bottom: 0; }

  .flip-top, .flip-bottom { visibility: hidden; }
  .card.flipping .flip-top {
    visibility: visible;
    animation: flipTop .3s ease-in forwards;
  }
  .card.flipping .flip-bottom {
    visibility: visible;
    transform: rotateX(90deg);
    animation: flipBottom .3s ease-out .3s forwards;
  }
  @keyframes flipTop    { from { transform: rotateX(0); }     to { transform: rotateX(-90deg); } }
  @keyframes flipBottom { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }

  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: calc(var(--w) * 0.025); transform: translateY(-50%);
    background: var(--slit); z-index: 5;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    border-radius: calc(var(--w) * 0.08);
    box-shadow: 0 calc(var(--w) * 0.04) calc(var(--w) * 0.12) rgba(0,0,0,.7);
  }

  /* =========================== NIXIE-RÖHREN =========================== */
  .clock.nixie .colon {
    display: flex; flex-direction: column; gap: calc(var(--tw) * 0.34);
    padding-bottom: calc(var(--tw) * 0.2);
  }
  .clock.nixie .colon i {
    display: block;
    width: calc(var(--tw) * 0.12); height: calc(var(--tw) * 0.12);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ffe2b8, #ff8a2a 60%, #c4501a);
    box-shadow: 0 0 calc(var(--tw) * 0.1) calc(var(--tw) * 0.03) rgba(255, 120, 30, .75),
                0 0 calc(var(--tw) * 0.3) rgba(255, 100, 20, .45);
    transition: opacity .35s ease;
  }
  .clock.nixie .colon i.off { opacity: .25; }

  .tube {
    position: relative;
    width: var(--tw);
    height: calc(var(--tw) * 1.78);
  }
  .glass {
    position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--tw) * 0.2);
    border-radius: calc(var(--tw) * 0.5) calc(var(--tw) * 0.5) calc(var(--tw) * 0.1) calc(var(--tw) * 0.1);
    background: radial-gradient(ellipse at 50% 50%, #1b0d06 0%, #0a0504 70%, #050302 100%);
    overflow: hidden;
    box-shadow:
      inset 0 0 calc(var(--tw) * 0.16) rgba(255, 120, 40, .2),
      inset 0 0 0 1.5px rgba(255, 255, 255, .13),
      0 0 calc(var(--tw) * 0.3) rgba(255, 100, 20, .22);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 48%, rgba(255, 130, 40, .34), transparent 64%);
  }
  .mesh {
    position: absolute; inset: 0; opacity: .9;
    background-image:
      repeating-linear-gradient(60deg,  transparent 0 4px, rgba(255, 170, 90, .075) 4px 5px),
      repeating-linear-gradient(-60deg, transparent 0 4px, rgba(255, 170, 90, .075) 4px 5px),
      repeating-linear-gradient(0deg,   transparent 0 4px, rgba(255, 170, 90, .05) 4px 5px);
  }
  .wires { position: absolute; left: 12%; right: 12%; top: 10%; bottom: 8%; }
  .wires svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .dim path {
    fill: none; stroke: rgba(175, 115, 75, .32); stroke-width: 1.3;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .dg { opacity: 0; transition: opacity .1s linear; }
  .dg.on { opacity: 1; }
  .dg .out  { fill: none; stroke: #ff8a2a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .dg .core { fill: none; stroke: #ffe6bf; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

  .shine {
    position: absolute; left: 8%; top: 6%; width: 17%; height: 62%;
    border-radius: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,.24), rgba(255,255,255,0));
    filter: blur(1px);
  }
  .base {
    position: absolute; left: 10%; right: 10%; bottom: 0;
    height: calc(var(--tw) * 0.25);
    background: linear-gradient(90deg, #151515, #7a7a7a 28%, #2c2c2c 58%, #101010);
    border-radius: 0 0 calc(var(--tw) * 0.08) calc(var(--tw) * 0.08);
    box-shadow: 0 calc(var(--tw) * 0.04) calc(var(--tw) * 0.1) rgba(0,0,0,.7);
  }
  .base::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0;
    height: calc(var(--tw) * 0.04);
    background: linear-gradient(90deg, #6b3d17, #d89a52 40%, #8a5420);
  }


  /* =========================== LCD (Casio-Stil) =========================== */
  .clock.lcd {
    --lcd-bg1: #a6e6cf; --lcd-bg2: #5fae96;
    --on: #0b1d17; --off: rgba(8, 40, 30, .075);
    --lcd-ink: #0b1d17; --lcd-ghost: rgba(8, 40, 30, .2);
    --lcd-glow: rgba(150, 255, 215, .35);
    --lcd-shadow: rgba(0, 25, 15, .26);
  }
  :root.light .clock.lcd {
    --lcd-bg1: #cfd6b6; --lcd-bg2: #a8b28d;
    --on: #1b2016; --off: rgba(30, 38, 20, .07);
    --lcd-ink: #1b2016; --lcd-ghost: rgba(30, 38, 20, .2);
    --lcd-glow: rgba(255, 255, 255, 0);
    --lcd-shadow: rgba(40, 45, 25, .28);
  }
  .lcd-panel {
    position: relative; overflow: hidden;
    width: calc(var(--u) * 89.6);
    height: calc(var(--u) * 25.2);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.8) calc(var(--u) * 1.8);
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto 1fr;
    column-gap: calc(var(--u) * 1.6);
    row-gap: calc(var(--u) * .8);
    border-radius: calc(var(--u) * 1);
    background: radial-gradient(ellipse at 50% 45%, var(--lcd-bg1), var(--lcd-bg2) 95%);
    box-shadow:
      inset 0 0 calc(var(--u) * 3) var(--lcd-glow),
      inset 0 0 calc(var(--u) * 1.2) rgba(0, 0, 0, .5),
      inset 0 calc(var(--u) * .25) calc(var(--u) * .5) rgba(0, 0, 0, .55);
    color: var(--lcd-ink);
  }
  .lcd-panel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background:
      linear-gradient(115deg, rgba(255,255,255,.26), rgba(255,255,255,0) 34%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px);
  }
  .lcd-days {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between;
    padding: 0 calc(var(--u) * 1);
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    font-weight: 800;
    font-size: calc(var(--u) * 2.4);
    letter-spacing: .08em;
    transform: skewX(-8deg);
  }
  .lcd-days span { position: relative; color: var(--lcd-ghost); padding-bottom: calc(var(--u) * .6); }
  .lcd-days span.on { color: var(--lcd-ink); text-shadow: calc(var(--u) * .12) calc(var(--u) * .12) 0 var(--lcd-shadow); }
  .lcd-days span.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--u) * .4); background: var(--lcd-ink);
  }

  .lcd-left, .lcd-right { display: flex; flex-direction: column; min-width: 0; }
  .lcd-left  { align-items: flex-start; justify-content: flex-end; gap: calc(var(--u) * .9); }
  .lcd-right { align-items: flex-end;   justify-content: space-between; }
  .lcd-main { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.3); transform: skewX(-8deg); }
  .lcd-row  { display: flex; align-items: flex-end; gap: calc(var(--u) * .5); transform: skewX(-8deg); }
  .lcd-colon { display: flex; flex-direction: column; gap: calc(var(--u) * 3.8); margin: 0 calc(var(--u) * .3); }
  .lcd-colon i {
    display: block; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8);
    background: var(--on); box-shadow: calc(var(--u) * .14) calc(var(--u) * .14) 0 var(--lcd-shadow);
    transition: opacity .12s linear;
  }
  .lcd-colon.off i { opacity: .09; }

  .clock.lcd .s7 { filter: drop-shadow(calc(var(--u) * .16) calc(var(--u) * .16) 0 var(--lcd-shadow)); }
  .lcd-main .s7  { height: calc(var(--u) * 15);  width: calc(var(--u) * 9); }
  .lcd-sec .s7   { height: calc(var(--u) * 8.4); width: calc(var(--u) * 5.04); }
  .lcd-row .s7   { height: calc(var(--u) * 7.2); width: calc(var(--u) * 4.3); }
  .clock.lcd .dot {
    display: block; align-self: flex-end; background: var(--on); box-shadow: none;
    width: calc(var(--u) * 1); height: calc(var(--u) * 1); border-radius: 0;
    margin: 0 calc(var(--u) * .35) calc(var(--u) * .25);
  }
  .lcd-sec { display: flex; gap: calc(var(--u) * .5); transform: skewX(-8deg); }
  .lcd-small {
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    font-weight: 800; font-size: calc(var(--u) * 2.2); letter-spacing: .08em;
    transform: skewX(-8deg); white-space: pre;
  }
  .lcd-small.dim { color: var(--lcd-ghost); }

  /* =========================== ANALOG (Stahlgehäuse, Sunburst) =========================== */
  .clock.analog { width: calc(var(--u) * 89.6); }   /* Zifferblatt über die volle Fensterbreite */
  .clock.analog svg { display: block; width: 100%; height: auto; overflow: visible; }
  .clock.analog .a-num {
    fill: #efe6cf;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: 11.5px;
    text-anchor: middle; dominant-baseline: central;
  }
  .clock.analog .a-brand {
    fill: #d9dde4; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700; font-size: 4.2px; letter-spacing: 1.4px; text-anchor: middle;
  }
  .clock.analog .a-sub {
    fill: #8f96a1; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600; font-size: 2.7px; letter-spacing: 1.2px; text-anchor: middle;
  }

  /* =========================== VFD-Anzeigen (Wetter oben, Datum unten) =========================== */
  .vfd {
    --on: #a9ffe7;  --off: rgba(110, 255, 220, .07);
    --dim: rgba(110, 255, 220, .16);  --lit: #b4ffe9;
    --g1: rgba(90, 255, 215, .9);  --g2: rgba(60, 230, 190, .5);
    --bgc1: #08171c;  --bgc2: #03090b;

    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(var(--u) * 2);
    padding: calc(var(--u) * .9) calc(var(--u) * 2.4);
    width: 0; min-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    border-radius: calc(var(--u) * .8);
    background: radial-gradient(ellipse at 50% 50%, var(--bgc1), var(--bgc2) 78%);
    box-shadow:
      inset 0 0 calc(var(--u) * 1.4) rgba(0, 0, 0, .95),
      inset 0 1px 3px rgba(0, 0, 0, .9),
      0 1px 0 rgba(255, 255, 255, .25);
  }
  .vfd.warm {
    --on: #ffa23c;  --off: rgba(255, 150, 50, .08);
    --dim: rgba(255, 150, 50, .18);  --lit: #ffb560;
    --g1: rgba(255, 140, 30, .9);  --g2: rgba(255, 100, 20, .5);
    --bgc1: #1a0e06;  --bgc2: #070403;
  }
  .vfd::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px);
  }

  .vfd-days {
    display: flex; gap: calc(var(--u) * .9);
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    font-weight: 700;
    font-size: calc(var(--u) * 1.8);
    letter-spacing: .06em;
  }
  .dy { color: var(--dim); }
  .dy.on {
    color: var(--lit);
    text-shadow: 0 0 5px var(--g1), 0 0 12px var(--g2);
  }

  .vfd-date, .vfd-kw { display: flex; align-items: center; gap: calc(var(--u) * .55); }
  .vfd-kw .dy { margin-right: calc(var(--u) * .4); }
  .vfd-txt { display: flex; align-items: center; gap: calc(var(--u) * .45); }
  .vfd .mon { display: flex; align-items: center; gap: calc(var(--u) * .55); margin: 0 calc(var(--u) * .5); }
  .vfd > *, .vfd-date > *, .vfd-kw > *, .vfd-txt > *, .vfd .mon > *, .vfd-days > * { flex-shrink: 0; }

  .s7 {
    display: block; overflow: visible;
    height: calc(var(--u) * 4); width: calc(var(--u) * 2.4);
    filter: drop-shadow(0 0 2px var(--g1)) drop-shadow(0 0 6px var(--g2));
  }
  .s7.sm { height: calc(var(--u) * 2.8); width: calc(var(--u) * 1.68); }
  .vfd .mon .s7.sm { height: calc(var(--u) * 4); width: calc(var(--u) * 2.4); }

  .vfd-days, .vfd-date, .vfd-kw, .vfd-txt { transform: skewX(-9deg); }

  .vfd .fl { opacity: .7; }
  .vfd.dip { opacity: .88; }
  .s7 polygon { fill: var(--off); }
  .s7 polygon.on { fill: var(--on); }
  .vfd .dot {
    display: block; align-self: flex-end;
    width: calc(var(--u) * .5); height: calc(var(--u) * .5);
    margin: 0 calc(var(--u) * .2) calc(var(--u) * .3);
    border-radius: 50%;
    background: var(--on);
    box-shadow: 0 0 4px var(--g1), 0 0 9px var(--g2);
  }
  .vfd .deg {
    display: block; align-self: flex-start;
    width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1);
    margin: calc(var(--u) * .2) calc(var(--u) * .1) 0;
    border-radius: 50%;
    border: calc(var(--u) * .3) solid var(--on);
    box-shadow: 0 0 4px var(--g1), inset 0 0 3px var(--g1);
  }

  .vfd .wslot, .vfd .wtemp, .vfd .wdesc {
    transition: transform .9s cubic-bezier(.22, .61, .36, 1), opacity .9s ease;
    will-change: transform, opacity;
  }
  .vfd .wout { transform: translateX(-110%); opacity: 0; }
  .vfd .win  { transform: translateX(110%);  opacity: 0; transition: none; }

  /* =========================== RÄUMLICHE TIEFE =========================== */
  .card .top, .card .flip-top {
    box-shadow:
      inset 0 0 0 max(1.5px, calc(var(--w) * 0.012)) var(--edge),
      inset 0 calc(var(--w) * 0.05) calc(var(--w) * 0.09) rgba(0,0,0,.55),
      inset 0 calc(var(--w) * 0.01) calc(var(--w) * 0.02) rgba(0,0,0,.30);
  }
  .card .bottom, .card .flip-bottom {
    box-shadow:
      inset 0 0 0 max(1.5px, calc(var(--w) * 0.012)) var(--edge),
      inset 0 calc(var(--w) * -0.05) calc(var(--w) * 0.09) rgba(0,0,0,.55),
      inset 0 calc(var(--w) * -0.01) calc(var(--w) * 0.02) rgba(0,0,0,.30);
  }
  .card::after {
    box-shadow:
      0 calc(var(--w) * -0.012) calc(var(--w) * 0.035) rgba(255,190,120,.12),
      0 calc(var(--w) *  0.012) calc(var(--w) * 0.050) rgba(0,0,0,.65);
  }

  .glass::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,.10) 6%,
        transparent 22%,
        transparent 78%,
        rgba(0,0,0,.10) 94%,
        rgba(0,0,0,.55) 100%),
      linear-gradient(90deg,
        transparent 78%,
        rgba(255,220,180,.10) 86%,
        rgba(255,220,180,.04) 91%,
        transparent 96%);
  }

  /* =========================== BURN-IN-SCHUTZ =========================== */
  body.saver .clock .seconds-group,
  body.saver .clock .colon.second,
  body.saver #weather { display: none !important; }
  body.saver { filter: brightness(0.55); }
  body.night.saver { filter: brightness(0.15); }

  .case { transition: transform 1.5s ease; }

  .window::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit;
    z-index: 0;
    background:
      radial-gradient(ellipse 62% 48% at 50% 46%, rgba(255,220,180,.055) 0%, transparent 72%),
      linear-gradient(180deg, transparent 62%, rgba(0,0,0,.18) 100%);
  }

  body.face-nixie .window::before {
    background:
      radial-gradient(ellipse 70% 52% at 50% 50%, rgba(255,140,40,.075) 0%, transparent 76%),
      linear-gradient(180deg, transparent 62%, rgba(0,0,0,.18) 100%);
  }

  /* =========================== MARKENPLAKETTE =========================== */
  .case::after {
    content: "* stefan-wehner.de * Nixie Tube & Flipcard & LCD & Analog Clock V2.2 *";
    position: absolute;
    bottom: calc(var(--u) * 0.8 - 2mm);
    left: calc(var(--u) * 7.6);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: calc(var(--u) * 1.15);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: rgba(255, 255, 255, 0.62);
    text-shadow:
      0 1px 0 rgba(0, 0, 0, 0.6),
      0 -1px 0 rgba(255, 255, 255, 0.22);
    pointer-events: none;
    z-index: 10;
  }

  :root.light .case::after {
    color: rgba(0, 0, 0, 0.52);
    text-shadow:
      0 1px 0 rgba(255, 255, 255, 0.55),
      0 -1px 0 rgba(0, 0, 0, 0.18);
  }

  /* =========================== LCD-MODUS: untere VFD-Zeile entfällt =========================== */
  body.face-lcd #date { display: none; }
</style>

      '<div class="half top"><span>0</span></div>' +
      '<div class="half bottom"><span>0</span></div>' +

  var WMO = {
    0: ['Klar', '☀️', '🌙'], 1: ['Überwiegend klar', '🌤️', '🌙'], 2: ['Teils bewölkt', '⛅', '☁️'],
    3: ['Bedeckt', '☁️', '☁️'], 45: ['Nebel', '🌫️', '🌫️'], 48: ['Reifnebel', '🌫️', '🌫️'],
    51: ['Leichter Nieselregen', '🌦️', '🌧️'], 53: ['Nieselregen', '🌦️', '🌧️'], 55: ['Starker Nieselregen', '🌧️', '🌧️'],
    56: ['Gefrierender Niesel', '🌧️', '🌧️'], 57: ['Gefrierender Niesel', '🌧️', '🌧️'],
    61: ['Leichter Regen', '🌦️', '🌧️'], 63: ['Regen', '🌧️', '🌧️'], 65: ['Starker Regen', '🌧️', '🌧️'],
    66: ['Gefrierender Regen', '🌧️', '🌧️'], 67: ['Gefrierender Regen', '🌧️', '🌧️'],
    71: ['Leichter Schnee', '🌨️', '🌨️'], 73: ['Schnee', '🌨️', '🌨️'], 75: ['Starker Schnee', '❄️', '❄️'],
    77: ['Schneegriesel', '🌨️', '🌨️'], 80: ['Leichte Schauer', '🌦️', '🌧️'], 81: ['Regenschauer', '🌧️', '🌧️'],
    82: ['Starke Schauer', '⛈️', '⛈️'], 85: ['Schneeschauer', '🌨️', '🌨️'], 86: ['Starke Schneeschauer', '❄️', '❄️'],
    95: ['Gewitter', '⛈️', '⛈️'], 96: ['Gewitter mit Hagel', '⛈️', '⛈️'], 99: ['Gewitter mit Hagel', '⛈️', '⛈️']
  };

  var CITIES = [
    { key: 'accra',     name: 'Accra',     lat: 5.6037,  lon: -0.1870  },
    { key: 'bonn',      name: 'Bonn',      lat: 50.7374, lon: 7.0982   },
    { key: 'berlin',    name: 'Berlin',    lat: 52.5200, lon: 13.4050  },
    { key: 'ny',        name: 'New York',  lat: 40.7128, lon: -74.0060 },
    { key: 'moskau',    name: 'Moskau',    lat: 55.7558, lon: 37.6173  },
    { key: 'prag',      name: 'Prag',      lat: 50.0755, lon: 14.4378  },
    { key: 'jakarta',   name: 'Jakarta',   lat: -6.2088, lon: 106.8456 },
    { key: 'magdeburg', name: 'Magdeburg', lat: 52.1205, lon: 11.6276  }
  ];
  var weatherData = {};
  CITIES.forEach(function (c) { weatherData[c.key] = { t: null, text: '' }; });
  var currentCity = 0;

  function loadCity(city) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.lat +
              '&longitude=' + city.lon +
              '&current=temperature_2m,weather_code,is_day&timezone=auto';
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      var c = j.current;
      if (!c) return;
      var w = WMO[c.weather_code] || ['', '', ''];
      weatherData[city.key] = { t: Math.round(c.temperature_2m), text: w[0] };
      if (CITIES[currentCity].key === city.key && !rotating) {
        paintWeather(city.name, weatherData[city.key].t, weatherData[city.key].text);
      }
    }).catch(function () {});
  }
  function loadAllWeather() { CITIES.forEach(loadCity); }

  var rotating = false;
  function rotateTo(i) {
    if (rotating) return;
    rotating = true;
    var parts = [wSlot, wTemp, wDesc];
    parts.forEach(function (p) { p.classList.add('wout'); p.classList.remove('win'); });
    setTimeout(function () {
      currentCity = i;
      var c = CITIES[i];
      var d = weatherData[c.key];
      paintWeather(c.name, d.t, d.text);
      parts.forEach(function (p) { p.classList.remove('wout'); p.classList.add('win'); });
      void weatherEl.offsetWidth;
      requestAnimationFrame(function () {
        parts.forEach(function (p) { p.classList.remove('win'); });
      });
      setTimeout(function () { rotating = false; }, 950);
    }, 900);
  }

  loadAllWeather();
  setInterval(loadAllWeather, 10 * 60 * 1000);
  setInterval(function () { rotateTo((currentCity + 1) % CITIES.length); }, 10 * 1000);

  /* ======================= VFD-Flackern ======================= */
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function flickerOnce() {
    var vfds = [].filter.call(document.querySelectorAll('.vfd'), function (el) { return el.offsetParent !== null; });
    if (!vfds.length) return;
    var v = vfds[Math.floor(Math.random() * vfds.length)];
    var cands = v.querySelectorAll('.s7, .dy.on, .dot, .deg');
    if (!cands.length) return;
    var n = Math.random() < 0.25 ? 2 : 1;
    var picked = [];
    for (var i = 0; i < n; i++) picked.push(cands[Math.floor(Math.random() * cands.length)]);
    function blink(on) { picked.forEach(function (e) { e.classList.toggle('fl', on); }); }
    blink(true);
    setTimeout(function () {
      blink(false);
      if (Math.random() < 0.35) {
        setTimeout(function () {
          blink(true);
          setTimeout(function () { blink(false); }, rnd(30, 70));
        }, rnd(40, 90));
      }
    }, rnd(40, 110));
    if (Math.random() < 0.12) {
      v.classList.add('dip');
      setTimeout(function () { v.classList.remove('dip'); }, rnd(50, 90));
    }
  }
  function scheduleFlicker() {
    setTimeout(function () { flickerOnce(); scheduleFlicker(); }, rnd(800, 4500));
  }
  if (!reduceMotion) scheduleFlicker();

  /* ======================= BURN-IN-SCHUTZ: PIXEL-SHIFT ======================= */
  (function pixelShift() {
    var caseEl = document.querySelector('.case');
    function shift() {
      var x = Math.floor(Math.random() * 5) - 2;
      var y = Math.floor(Math.random() * 5) - 2;
      caseEl.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    }
    shift();
    setInterval(shift, 5 * 60 * 1000);
  })();

  /* ======================= BURN-IN-SCHUTZ: SCREENSAVER ======================= */
  var SAVER_MS = 2 * 60 * 60 * 1000;
  var saverTimer = null;
  function resetSaver() {
    document.body.classList.remove('saver');
    if (saverTimer) clearTimeout(saverTimer);
    saverTimer = setTimeout(function () {
      document.body.classList.add('saver');
    }, SAVER_MS);
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, resetSaver, { passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') resetSaver();
  });
  resetSaver();

  /* ======================= DISPLAY WACHHALTEN ======================= */
  function wake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').catch(function () {});
  }
  wake();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') wake();
  });

  /* ======================= AUTO-RELOAD BEI NEUER VERSION ======================= */
  (function autoReload() {
    if (!/^https?:$/.test(location.protocol)) return;   // nur für http(s) sinnvoll
    var CHECK_INTERVAL = 30000;
    var KEY = 'uhr-etag';
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) {}

    async function checkForUpdate() {
      if (document.visibilityState !== 'visible') return;
      try {
        var response = await fetch(window.location.href, {
          method: 'HEAD',
          cache: 'no-cache'
        });
        if (!response.ok) return;
        var current = response.headers.get('ETag') || response.headers.get('Last-Modified');
        if (!current) return;

        if (stored === null) {
          stored = current;
          try { localStorage.setItem(KEY, current); } catch (e) {}
        } else if (current !== stored) {
          try { localStorage.setItem(KEY, current); } catch (e) {}
          window.location.reload();
        }
      } catch (e) {
        /* Netzwerkfehler – beim nächsten Intervall erneut versuchen */
      }
    }

    checkForUpdate();
    setInterval(checkForUpdate, CHECK_INTERVAL);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') checkForUpdate();
    });
  })();

})();
</script>
